apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-secrets-store-provider-gcp-sa
  namespace: openshift-cluster-csi-drivers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-secrets-store-provider-gcp-role
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-secrets-store-provider-gcp-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-secrets-store-provider-gcp-role
subjects:
- kind: ServiceAccount
  name: csi-secrets-store-provider-gcp-sa
  namespace: openshift-cluster-csi-drivers
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-secrets-store-provider-gcp
  namespace: openshift-cluster-csi-drivers
  labels:
    app: csi-secrets-store-provider-gcp
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: csi-secrets-store-provider-gcp
  template:
    metadata:
      labels:
        app: csi-secrets-store-provider-gcp
    spec:
      serviceAccountName: csi-secrets-store-provider-gcp-sa
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
      - name: provider-gcp-installer
        image: us-docker.pkg.dev/secretmanager-csi/secrets-store-csi-driver-provider-gcp/plugin:v1.18.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: TARGET_DIR
          value: "/etc/kubernetes/secrets-store-csi-providers"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/gcp-credentials/service_account.json"
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - mountPath: "/etc/kubernetes/secrets-store-csi-providers"
          name: providervol
        - mountPath: "/var/lib/kubelet/pods"
          mountPropagation: HostToContainer
          name: mountpoint-dir
          readOnly: true
        - mountPath: "/etc/gcp-credentials"
          name: gcp-creds
          readOnly: true
        - mountPath: "/var/run/secrets/openshift/serviceaccount"
          name: bound-sa-token
          readOnly: true
        livenessProbe:
          httpGet:
            path: /live
            port: 8095
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 10
          periodSeconds: 30
      volumes:
      - name: providervol
        hostPath:
          path: "/var/run/secrets-store-csi-providers"
          type: DirectoryOrCreate
      - name: mountpoint-dir
        hostPath:
          path: "/var/lib/kubelet/pods"
          type: DirectoryOrCreate
      - name: gcp-creds
        secret:
          secretName: gcp-secrets-store-cloud-credentials
      - name: bound-sa-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: openshift
              expirationSeconds: 3600
              path: token
      nodeSelector:
        kubernetes.io/os: linux
